# Audio analysis for the lock screen aura (read by Service.qml).
# Six mono bands, low to high, written as "n;n;n;n;n;n;" lines with values 0-100.
[general]
framerate = 45
bars = 6
autosens = 1
sleep_timer = 0
lower_cutoff_freq = 40
higher_cutoff_freq = 8000

[input]
method = pipewire
source = auto

[output]
method = raw
channels = mono
mono_option = average
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 30
