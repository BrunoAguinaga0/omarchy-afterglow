# Audio levels for the music pill's aura (read by Widget.qml).
# Three mono bands, low to high, written as "n;n;n;" lines with values 0-100.
[general]
framerate = 30
bars = 3
autosens = 1
sleep_timer = 0
lower_cutoff_freq = 40
higher_cutoff_freq = 6000

[input]
method = pipewire
source = auto

[output]
method = raw
channels = mono
mono_option = average
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 45
